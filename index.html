<!-- Header -->
<header class="text-center py-6">
  <h1 class="text-4xl md:text-5xl font-bold text-[#D4AF37]">
    Kairah Studio
  </h1>
</header>

<!-- Hero Section -->
<section class="text-center py-16 bg-gradient-to-b from-[#3D2C41] to-[#1a1424]">
  <h2 class="text-5xl md:text-6xl font-bold text-[#D4AF37] mb-4">
    Create AI-Powered Cinematic Worlds
  </h2>
  <p class="text-xl md:text-2xl mb-4">
    Bring your imagination to life with AI. Transform text or photos into stunning videos.
  </p>
  <a href="#signup" class="btn mt-4 text-lg">Start Creating / Sign In</a>
</section>
<script>
  // Your Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyAGlNOCAwsgeDnSJtBux2uIMuP0p_jBJns",
    authDomain: "kairah-studio.firebaseapp.com",
    projectId: "kairah-studio",
    storageBucket: "kairah-studio.appspot.com",
    messagingSenderId: "145122424961",
    appId: "1:145122424961:web:31156e5b0f185d7c503580",
    measurementId: "G-X4VGPQSNGD"
  };

  // Initialize Firebase (Compat Version)
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();

  // SIGN UP
  document.getElementById("signup-btn").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      alert("❌ Please enter email and password.");
      return;
    }

    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        userCredential.user.sendEmailVerification()
          .then(() => {
            alert("✅ Account created! Check your email for verification.");
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
          });
      })
      .catch((error) => {
        alert("❌ " + error.message);
      });
  });

  // LOGIN
  document.getElementById("login-btn").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      alert("❌ Please enter email and password.");
      return;
    }

    auth.signInWithEmailAndPassword(email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        if (!user.emailVerified) {
          alert("⚠️ Please verify your email before accessing Kairah Studio.");
          auth.signOut();
          return;
        }

        alert("✅ Login Successful. Redirecting...");
        window.location.href = "#video-tool"; // jump to video tool section
      })
      .catch((error) => {
        alert("❌ " + error.message);
      });
  });

  // GOOGLE LOGIN
  document.getElementById("google-login").addEventListener("click", () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider)
      .then((result) => {
        alert("✅ Signed in with Google!");
        window.location.href = "#video-tool";
      })
      .catch((error) => {
        alert("❌ " + error.message);
      });
  });
</script>
